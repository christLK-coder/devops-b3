apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: legeni-prod
resources:
  - ../../base
labels:
  - pairs:
      env: prod
patches:
  - path: replicas-patch.yaml
images:
  - name: legeni-webapp
    newName: christlk/legeni-webapp
    newTag: "1.0.3"
configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - APP_COLOR=#2da44e
