apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: legeni-dev
  labels: {app: webapp}
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: webapp}
  template:
    metadata:
      labels: {app: webapp}
    spec:
      containers:
        - name: webapp
          image: christlk/legeni-webapp:2.0.0
          ports:
            - containerPort: 5000
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          envFrom:
            - configMapRef:
                name: webapp-config
            - secretRef:
                name: redis-secret
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: legeni-dev
spec:
  type: NodePort
  selector: {app: webapp}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080


