apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legeni
  namespace: legeni-dev
spec:
  ingressClassName: nginx
  rules:
    - host: legeni.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
  tls:
    - hosts: [legeni.local]
      secretName: legeni-tls
