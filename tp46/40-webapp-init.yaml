apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: webapp-redis }
  template:
    metadata:
      labels: { app: webapp-redis }
    spec:
      initContainers:
        - name: attendre-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo 'Redis indisponible, attente...'; sleep 2; done; echo 'Redis OK'"]
      containers:
        - name: webapp
          image: christlk/legeni-webapp:1.0.3
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          ports: [{ containerPort: 5000 }]
