apiVersion: batch/v1
kind: Job
metadata:
  name: traitement-lots
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lot
          image: busybox:1.36
          command: ["sh", "-c", "echo \"Traitement du lot $JOB_COMPLETION_INDEX sur $(hostname)\"; sleep 5"]
