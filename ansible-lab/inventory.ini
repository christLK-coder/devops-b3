# Inventaire du lab : les 3 nœuds sont joignables via les ports SSH publiés sur la machine locale
[web]
web1 ansible_host=web1 ansible_port=22
web2 ansible_host=web2 ansible_port=22

[db]
db1 ansible_host=db1 ansible_port=22

[wordpress_servers]
db1

[lab:children]
web
db

[lab:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/root/.ssh/id_ansible
ansible_python_interpreter=/usr/bin/python3
